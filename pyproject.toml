[project]
name = "nsekit-mcp"
version = "0.0.31"
description = "FastMCP server for NSE India market data using NseKit"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "mcp[cli]>=2.0.0",
    "nsekit>=0.0.43",
    "typer>=0.20.0",
]

[project.scripts]
nsekit-mcp = "nsekit_mcp.server_async:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
import os

def main() -> None:
    print("🔵 Starting NseKit-MCP HTTP server...")
    mcp.run(
        transport="streamable-http",
        host="0.0.0.0",
        port=int(os.environ.get("PORT", "10000")),
        json_response=True,
        stateless_http=True,
    )

if __name__ == "__main__":
    main()
